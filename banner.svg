<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="BST Playground banner with a binary search tree being built">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0F2E"/><stop offset="1" stop-color="#2A1235"/></linearGradient>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FBBF24" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,Consolas,monospace}
    .n,.e{opacity:0;animation:pop 9s ease-out infinite}
    .n circle{fill:#2A1235;stroke:#FBBF24;stroke-width:2.5}.n text{fill:#FEF3C7;font-size:16px;text-anchor:middle;font-family:ui-monospace,Consolas,monospace}
    .e{stroke:#FBBF24;stroke-opacity:.5;stroke-width:2}
    .a1{animation-delay:0s}.a2{animation-delay:.6s}.a3{animation-delay:1.2s}.a4{animation-delay:1.8s}.a5{animation-delay:2.4s}.a6{animation-delay:3s}.a7{animation-delay:3.6s}
    @keyframes pop{0%{opacity:0}4%{opacity:1}90%{opacity:1}100%{opacity:0}}
    .walk{opacity:0;animation:walk 9s linear infinite}
    @keyframes walk{0%,45%{opacity:0}46%{opacity:1}88%{opacity:1}90%{opacity:0}}
  </style>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/><rect width="1200" height="320" rx="22" fill="url(#g)"/>
  <text x="64" y="120" class="t" font-size="66" font-weight="700" fill="#FEF3C7" letter-spacing="-2">BST Playground</text>
  <text x="66" y="162" class="t" font-size="22" fill="#FCD34D">See every insert, delete and traversal happen</text>
  <text x="66" y="196" class="m" font-size="15" fill="#FBBF24" opacity=".75">insert(50) → compare → go left → place</text>
  <g class="m" font-size="14" fill="#FDE68A"><text x="66" y="262">in-order:</text><text x="160" y="262" fill="#FEF3C7">20 30 40 50 60 70 80</text>
    <rect x="66" y="274" width="0" height="3" fill="#FBBF24"><animate attributeName="width" values="0;0;250;250" keyTimes="0;.46;.88;1" dur="9s" repeatCount="indefinite"/></rect></g>
  <!-- tree -->
  <g>
    <line class="e a2" x1="880" y1="70" x2="790" y2="150"/><line class="e a3" x1="880" y1="70" x2="970" y2="150"/>
    <line class="e a4" x1="790" y1="150" x2="745" y2="235"/><line class="e a5" x1="790" y1="150" x2="835" y2="235"/>
    <line class="e a6" x1="970" y1="150" x2="925" y2="235"/><line class="e a7" x1="970" y1="150" x2="1015" y2="235"/>
    <g class="n a1"><circle cx="880" cy="70" r="24"/><text x="880" y="76">50</text></g>
    <g class="n a2"><circle cx="790" cy="150" r="24"/><text x="790" y="156">30</text></g>
    <g class="n a3"><circle cx="970" cy="150" r="24"/><text x="970" y="156">70</text></g>
    <g class="n a4"><circle cx="745" cy="235" r="24"/><text x="745" y="241">20</text></g>
    <g class="n a5"><circle cx="835" cy="235" r="24"/><text x="835" y="241">40</text></g>
    <g class="n a6"><circle cx="925" cy="235" r="24"/><text x="925" y="241">60</text></g>
    <g class="n a7"><circle cx="1015" cy="235" r="24"/><text x="1015" y="241">80</text></g>
    <circle class="walk" r="30" fill="none" stroke="#F472B6" stroke-width="3">
      <animate attributeName="cx" values="745;745;790;835;880;925;970;1015;1015" keyTimes="0;.46;.52;.58;.64;.70;.76;.82;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="235;235;150;235;70;235;150;235;235" keyTimes="0;.46;.52;.58;.64;.70;.76;.82;1" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
